name: Create release tags

# One-off: tags every past game release and creates its GitHub Release.
# Run it once from the Actions tab, then delete this file and release-backfill.tsv.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\t' read -r tag commit title notes; do
            [ -z "$tag" ] && continue
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
              echo "skip $tag (exists)"; continue
            fi
            sha=$(git rev-parse "$commit^{commit}")
            git tag -a "$tag" "$sha" -m "$title"
            git push origin "refs/tags/$tag"
            latest=false
            [ "$tag" = "rally-v0.33.23" ] && latest=true
            gh release create "$tag" --verify-tag --title "$title" --notes "$(printf '%b' "$notes")" --latest="$latest"
            echo "created $tag at $sha"
          done < .github/release-backfill.tsv
