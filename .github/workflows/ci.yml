name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Seven parallel jobs: regular tests per game, integration playtests per game
# (integration-tests/<game>), and everything else (portal / shared + typecheck + lint).
# Integration tests are slow, so `changes` (scripts/ci-affected.mjs) picks the test files whose import closure
# contains a changed file; a game with none is skipped (a skipped job counts as passed for required checks).
# Pushes to main run every integration test.
jobs:
  changes:
    name: pick integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rally: ${{ steps.pick.outputs.rally }}
      hole: ${{ steps.pick.outputs.hole }}
      kaboom: ${{ steps.pick.outputs.kaboom }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          node scripts/ci-affected.mjs $base | tee -a "$GITHUB_OUTPUT"

  rally:
    name: rally tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:rally

  rally-integration:
    name: rally integration tests
    needs: changes
    if: needs.changes.outputs.rally != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx rstest ${{ needs.changes.outputs.rally }}

  hole:
    name: hole tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:hole

  kaboom:
    name: kaboom tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:kaboom

  hole-integration:
    name: hole integration tests
    needs: changes
    if: needs.changes.outputs.hole != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx rstest ${{ needs.changes.outputs.hole }}

  kaboom-integration:
    name: kaboom integration tests
    needs: changes
    if: needs.changes.outputs.kaboom != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx rstest ${{ needs.changes.outputs.kaboom }}

  shared:
    name: shared / portal tests, typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Tests outside the game folders
        run: npm run test:shared
