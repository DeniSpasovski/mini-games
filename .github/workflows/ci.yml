name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Eight parallel jobs: regular tests per game, integration playtests per game
# (integration-tests/<game>), everything else (portal / shared + typecheck + lint) and a browser smoke test
# (scripts/smoke.mjs: each affected game's pages in headless Chrome on the dev server, SwiftShader GPU;
# skipped when no game is affected, e.g. docs only).
# Integration tests are slow, so `changes` (scripts/ci-affected.mjs) picks the test files whose import closure
# contains a changed file (rally drives: only physics, autopilot, car, road / terrain changes; the representative cars
# plus the changed ones); a game with none is skipped (a skipped job counts as passed for required checks).
# Pushes to main run every integration test with every car.
jobs:
  changes:
    name: pick integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rally: ${{ steps.pick.outputs.rally }}
      hole: ${{ steps.pick.outputs.hole }}
      kaboom: ${{ steps.pick.outputs.kaboom }}
      rally_cars: ${{ steps.pick.outputs.rally_cars }}
      rally_hill_cars: ${{ steps.pick.outputs.rally_hill_cars }}
      rally_hill_maps: ${{ steps.pick.outputs.rally_hill_maps }}
      smoke: ${{ steps.pick.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          node scripts/ci-affected.mjs $base | tee -a "$GITHUB_OUTPUT"

  rally:
    name: rally tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:rally

  rally-integration:
    name: rally integration tests
    needs: changes
    if: needs.changes.outputs.rally != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx rstest ${{ needs.changes.outputs.rally }}
        env:
          RALLY_CARS: ${{ needs.changes.outputs.rally_cars }}
          RALLY_HILL_CARS: ${{ needs.changes.outputs.rally_hill_cars }}
          RALLY_HILL_MAPS: ${{ needs.changes.outputs.rally_hill_maps }}

  hole:
    name: hole tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:hole

  kaboom:
    name: kaboom tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:kaboom

  hole-integration:
    name: hole integration tests
    needs: changes
    if: needs.changes.outputs.hole != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx rstest ${{ needs.changes.outputs.hole }}

  kaboom-integration:
    name: kaboom integration tests
    needs: changes
    if: needs.changes.outputs.kaboom != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx rstest ${{ needs.changes.outputs.kaboom }}

  shared:
    name: shared / portal tests, typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Tests outside the game folders
        run: npm run test:shared

  smoke:
    name: browser smoke test
    needs: changes
    if: needs.changes.outputs.smoke != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dev server
        run: |
          npm run dev:noreload -- --port 3000 > dev-server.log 2>&1 &
          for i in $(seq 1 150); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 2; done
          cat dev-server.log; exit 1
      - name: Game and tool pages load without console / WebGL errors
        run: npm run test:smoke -- --games ${{ needs.changes.outputs.smoke }}
