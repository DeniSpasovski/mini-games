name: Deploy to GitHub Pages

# Manual test deploy: Actions > Deploy to GitHub Pages > Run workflow, choose the branch.
on:
  workflow_dispatch:
    inputs:
      test_build:
        description: 'Test build: also offer the TEST cars / maps (npm run build:test)'
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ inputs.test_build && 'build:test' || 'build' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # GitHub sometimes lists a fresh artifact only seconds after the upload: deploy-pages then finds none and fails.
      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq .total_count || echo 0)
            if [ "$n" -gt 0 ]; then exit 0; fi
            sleep 4
          done
          echo "github-pages artifact still not listed after 2 minutes"
      - id: deployment
        uses: actions/deploy-pages@v5
